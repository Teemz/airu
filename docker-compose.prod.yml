version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: airu
      POSTGRES_USER: airu
      POSTGRES_PASSWORD: airupass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_URL: postgresql://airu:airupass@postgres:5432/airu
    depends_on:
      - postgres
    networks:
      - app_network

  admin-panel:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/admin-panel.conf:/etc/nginx/conf.d/default.conf:ro
      - ./admin-panel/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - app_network

  frontend-chat-widget:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/frontend-chat-widget.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend-chat-widget/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - app_network

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    environment:
      DB_SQLITE_FILE: "/data/database.sqlite"
      DISABLE_IPV6: "true"
    volumes:
      - nginx_proxy_manager_data:/data
      - nginx_proxy_manager_letsencrypt:/etc/letsencrypt
    depends_on:
      - backend
      - admin-panel
      - frontend-chat-widget
    networks:
      - app_network

volumes:
  postgres_data:
  nginx_proxy_manager_data:
  nginx_proxy_manager_letsencrypt:

networks:
  app_network:
    driver: bridge