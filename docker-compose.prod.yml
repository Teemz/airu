version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airu -d airu"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app_network

  admin-panel:
    image: nginx:alpine
    restart: unless-stopped
    user: nginx
    volumes:
      - ./nginx/admin.conf:/etc/nginx/nginx.conf:ro
      - ./admin-panel/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    labels:
      - "com.github.jc21.nginx-proxy-manager.enabled=true"
      - "com.github.jc21.nginx-proxy-manager.domain=admin.airu.local"
      - "com.github.jc21.nginx-proxy-manager.port=80"
      - "com.github.jc21.nginx-proxy-manager.scheme=http"
    networks:
      - app_network

  frontend-chat-widget:
    image: nginx:alpine
    restart: unless-stopped
    user: nginx
    volumes:
      - ./nginx/widget.conf:/etc/nginx/nginx.conf:ro
      - ./frontend-chat-widget/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    labels:
      - "com.github.jc21.nginx-proxy-manager.enabled=true"
      - "com.github.jc21.nginx-proxy-manager.domain=widget.airu.local"
      - "com.github.jc21.nginx-proxy-manager.port=80"
      - "com.github.jc21.nginx-proxy-manager.scheme=http"
    networks:
      - app_network

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    environment:
      DB_SQLITE_FILE: "/data/database.sqlite"
      DISABLE_IPV6: "true"
    volumes:
      - nginx_proxy_manager_data:/data
      - nginx_proxy_manager_letsencrypt:/etc/letsencrypt
    depends_on:
      - backend
      - admin-panel
      - frontend-chat-widget
    networks:
      - app_network

volumes:
  postgres_data:
  nginx_proxy_manager_data:
  nginx_proxy_manager_letsencrypt:

networks:
  app_network:
    driver: bridge