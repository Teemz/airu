version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_network

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - app_network

  backend:
    image: node:22
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "3001:3001"
    command: sh -c "npm install && npm run dev"
    environment:
      PORT: 3001
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    depends_on:
      - postgres
      - redis
    networks:
      - app_network

  worker:
    image: node:22
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./backend:/app
    command: sh -c "npm install && npm run worker"
    environment:
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    depends_on:
      - postgres
      - redis
    networks:
      - app_network

  npm:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
      - "8080:8080"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    depends_on:
      - backend
    networks:
      - app_network

  frontend-chat-widget:
    image: nginx:alpine
    volumes:
      - ./frontend-chat-widget/dist:/usr/share/nginx/html:ro
      - ./nginx/widget.conf:/etc/nginx/nginx.conf:ro
    command: nginx -g 'daemon off;'
    expose:
      - "80"
    depends_on:
      - npm
    networks:
      - app_network

  admin-panel:
    image: nginx:alpine
    volumes:
      - ./admin-panel/dist:/usr/share/nginx/html:ro
      - ./nginx/admin.conf:/etc/nginx/nginx.conf:ro
    command: nginx -g 'daemon off;'
    expose:
      - "80"
    depends_on:
      - npm
    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:
  npm_data:
    external: true
  npm_letsencrypt:
    external: true
  chroma_data:
  backend_node_modules:

networks:
  app_network: