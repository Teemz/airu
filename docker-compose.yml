version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: airu
      POSTGRES_USER: airu
      POSTGRES_PASSWORD: airupass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql  # optional

  backend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "3001:3001"
    command: sh -c "npm install && npm run dev"
    environment:
      DB_URL: postgresql://airu:airupass@postgres:5432/airu
      NODE_ENV: development
    depends_on:
      - postgres

volumes:
  postgres_data: